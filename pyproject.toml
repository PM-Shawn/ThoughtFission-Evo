[project]
name = "thoughtfission"
version = "0.1.0"
description = "Multi-agent reasoning engine with neural network visualization"
requires-python = ">=3.11"
dependencies = [
    "agentx @ file:///Users/didi/Documents/PM/ClaudeCodeDev/agentx",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["engine", "skills", "web"]
include = ["main.py", "config.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
